function b64ToUint8(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function uint8ToBase64(u8) {
  let bin = "";
  for (let i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]);
  return btoa(bin);
}

function bytesToHex(u8) {
  return Array.from(u8).map(b => b.toString(16).padStart(2, "0")).join("");
}

function base32ToUint8(b32) {
  const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
  const clean = b32.toUpperCase().replace(/[^A-Z2-7]/g, "");
  let bits = "";
  for (let i = 0; i < clean.length; i++) {
    bits += alphabet.indexOf(clean[i]).toString(2).padStart(5, "0");
  }
  const out = new Uint8Array(Math.floor(bits.length / 8));
  for (let i = 0; i < out.length; i++) {
    out[i] = parseInt(bits.slice(i * 8, i * 8 + 8), 2);
  }
  return out;
}

async function computeTotpCode(secretB32, counter) {
  const keyBytes = base32ToUint8(secretB32);
  const msg = new Uint8Array(8);
  let c = Math.floor(counter);
  for (let i = 7; i >= 0; i--) {
    msg[i] = c & 0xff;
    c = Math.floor(c / 256);
  }
  const cryptoKey = await crypto.subtle.importKey(
    "raw", keyBytes, { name: "HMAC", hash: "SHA-1" }, false, ["sign"]
  );
  const sig = new Uint8Array(await crypto.subtle.sign("HMAC", cryptoKey, msg));
  const offset = sig[sig.length - 1] & 0x0f;
  const code = (
    ((sig[offset] & 0x7f) << 24) |
    ((sig[offset + 1] & 0xff) << 16) |
    ((sig[offset + 2] & 0xff) << 8) |
    (sig[offset + 3] & 0xff)
  ) % 1000000;
  return String(code).padStart(6, "0");
}

async function verifyTotpWindow(secretB32, typedCode) {
  const clean = String(typedCode).trim();
  if (!/^\d{6}$/.test(clean)) return false;
  const curCounter = Math.floor(Date.now() / 1000 / 30);
  for (const delta of [-1, 0, 1]) {
    const expected = await computeTotpCode(secretB32, curCounter + delta);
    if (expected === clean) return true;
  }
  return false;
}

async function sha256Bytes(uint8Arr) {
  const buf = await crypto.subtle.digest("SHA-256", uint8Arr);
  return new Uint8Array(buf);
}

async function sha256Hex(str) {
  return bytesToHex(await sha256Bytes(new TextEncoder().encode(str)));
}

async function unlockVault() {
  const keyStr = document.getElementById("vaultKey").value.trim();
  const totpStr = document.getElementById("vaultTotp").value.trim();
  const errEl = document.getElementById("vaultErr");
  const btn = document.getElementById("unlockBtn");

  if (!keyStr) {
    errEl.className = "status err";
    errEl.textContent = "❌ Introduza a Password Mestra Complexa (1º Fator).";
    return;
  }
  if (!/^\d{6}$/.test(totpStr)) {
    errEl.className = "status err";
    errEl.textContent = "❌ Introduza os 6 dígitos do Google / Microsoft Authenticator (2º Fator).";
    return;
  }

  try {
    const salt = b64ToUint8(VAULT_SALT_B64);
    const cipherBytes = b64ToUint8(VAULT_CIPHER_B64);
    const baseKey = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(keyStr), { name: "PBKDF2" }, false, ["deriveBits"]
    );
    const bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", salt, iterations: VAULT_ITER, hash: "SHA-256" },
      baseKey, 512
    );
    const dk = new Uint8Array(bits);
    const encKey = dk.slice(0, 32);
    const macKey = dk.slice(32, 64);

    const hmacCryptoKey = await crypto.subtle.importKey(
      "raw", macKey, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]
    );
    const sigBuf = await crypto.subtle.sign("HMAC", hmacCryptoKey, cipherBytes);
    const calcMac = bytesToHex(new Uint8Array(sigBuf));

    if (calcMac !== VAULT_MAC_HEX) {
      btn.textContent = "🔓 VALIDAR 2FA E DESBLOQUEAR COFRE";
      errEl.className = "status err";
      errEl.textContent = "❌ Acesso Negado: Password Mestra Complexa incorreta!";
      return;
    }

    const plainBytes = new Uint8Array(cipherBytes.length);
    let counter = 0;
    let offset = 0;
    while (offset < cipherBytes.length) {
      const ctrBuf = new Uint8Array(36);
      ctrBuf.set(encKey, 0);
      ctrBuf[32] = (counter >>> 24) & 0xff;
      ctrBuf[33] = (counter >>> 16) & 0xff;
      ctrBuf[34] = (counter >>> 8) & 0xff;
      ctrBuf[35] = counter & 0xff;
      const block = await sha256Bytes(ctrBuf);
      const chunk = Math.min(32, cipherBytes.length - offset);
      for (let i = 0; i < chunk; i++) {
        plainBytes[offset + i] = cipherBytes[offset + i] ^ block[i];
      }
      offset += chunk;
      counter++;
    }

    const data = JSON.parse(new TextDecoder().decode(plainBytes));
    const totpOk = await verifyTotpWindow(data.totp_secret, totpStr);
    if (!totpOk) {
      btn.textContent = "🔓 VALIDAR 2FA E DESBLOQUEAR COFRE";
      errEl.className = "status err";
      errEl.textContent = "❌ Acesso Negado: Código 2FA de 6 dígitos inválido ou expirado!";
      return;
    }

    FLEET_CHANNEL = data.fleet_channel;
    FLEET_MASTER_SALT = data.fleet_salt;
    TOTP_SECRET_B32 = data.totp_secret;
    document.getElementById("appRoot").innerHTML = data.html;
    document.getElementById("curTechPin").value = keyStr;
    injectDeviceControlPanel();
    startFleetAckListener();
  } catch (e) {
    btn.textContent = "🔓 VALIDAR 2FA E DESBLOQUEAR COFRE";
    errEl.className = "status err";
    errEl.textContent = "❌ Erro na verificação 2FA: " + e.message;
  }
}

async function xorCrypt(dataBytes, keyStr) {
  const out = new Uint8Array(dataBytes.length);
  const keyBytes = new TextEncoder().encode(keyStr + "|" + FLEET_MASTER_SALT);
  let counter = 0;
  let offset = 0;
  while (offset < dataBytes.length) {
    const ctrBuf = new Uint8Array(keyBytes.length + 4);
    ctrBuf.set(keyBytes, 0);
    ctrBuf[keyBytes.length] = (counter >>> 24) & 0xff;
    ctrBuf[keyBytes.length + 1] = (counter >>> 16) & 0xff;
    ctrBuf[keyBytes.length + 2] = (counter >>> 8) & 0xff;
    ctrBuf[keyBytes.length + 3] = counter & 0xff;
    const block = await sha256Bytes(ctrBuf);
    const chunkLen = Math.min(32, dataBytes.length - offset);
    for (let i = 0; i < chunkLen; i++) {
      out[offset + i] = dataBytes[offset + i] ^ block[i];
    }
    offset += chunkLen;
    counter++;
  }
  return out;
}

const DEVICE_AUTH_SALT = "BD_ADMIN_DEVICE_AUTH_2026_9F8E";
const APP_VAULT_KEY_MGR = "BD#PosApp$2026!Key";

function loadFleetPosMap() {
  let map = { "pos_xd_be487236ba3240": "Restaurante-master" };
  try {
    const raw = localStorage.getItem("pos_admin_fleet_map");
    if (raw) Object.assign(map, JSON.parse(raw));
  } catch (e) {}
  return map;
}

function registerFleetPos(channel, hostname) {
  if (!channel || !hostname || !channel.startsWith("pos_xd_")) return;
  const map = loadFleetPosMap();
  if (map[channel] !== hostname) {
    map[channel] = hostname;
    try {
      localStorage.setItem("pos_admin_fleet_map", JSON.stringify(map));
    } catch (e) {}
    refreshAdminPosSelectors();
  }
}

function getPosOptionsHtml(selectedChannel = "") {
  const map = loadFleetPosMap();
  return Object.entries(map).map(([ch, name]) =>
    `<option value="${ch}" data-posname="${name}" ${ch === selectedChannel ? "selected" : ""}>🏪 ${name} (${ch.slice(0, 12)})</option>`
  ).join("");
}

function refreshAdminPosSelectors() {
  const manualSel = document.getElementById("manualPosSelect");
  if (manualSel) {
    const cur = manualSel.value;
    manualSel.innerHTML = getPosOptionsHtml(cur);
  }
}

function addManualPosToFleet() {
  const nameEl = document.getElementById("newPosHost");
  const chEl = document.getElementById("newPosChan");
  if (!nameEl || !chEl) return;
  const n = nameEl.value.trim();
  const c = chEl.value.trim();
  if (!n || !c) return;
  registerFleetPos(c, n);
  nameEl.value = "";
  chEl.value = "";
}

async function adminDecideDevice(ch, posName, devId, devName, approve) {
  const st = document.getElementById("status");
  const map = loadFleetPosMap();
  const targetCh = (ch || "pos_xd_be487236ba3240").trim();
  const targetPosName = (posName || map[targetCh] || "POS Restaurante").trim();
  const cleanId = (devId || "").trim().toUpperCase();
  if (!cleanId) {
    if (st) {
      st.className = "status err";
      st.textContent = "❌ Introduza o ID do Telemóvel (ex: MGR-XXXX-XXXX).";
    }
    return;
  }
  if (st) {
    st.className = "status ok";
    st.textContent = approve
      ? "⏳ A autorizar " + cleanId + " no POS " + targetPosName + "..."
      : "⏳ A revogar/bloquear telemóvel " + cleanId + "...";
  }
  try {
    const ts = String(Math.floor(Date.now() / 1000));
    const action = approve ? "admin_approve_device" : "admin_revoke_device";
    const sig = await sha256Hex(`${targetCh}|${action}|${cleanId}|${ts}|${DEVICE_AUTH_SALT}`);
    const devToken = approve
      ? await sha256Hex(`${targetCh}|DEV_APPROVED|${cleanId}|${DEVICE_AUTH_SALT}`)
      : "";

    const updatePacket = {
      device_auth_update: {
        device_id: cleanId,
        device_name: devName || cleanId,
        channel: targetCh,
        pos_name: targetPosName,
        approved: approve,
        device_token: devToken,
        app_vault_key: approve ? APP_VAULT_KEY_MGR : ""
      },
      revoked_device_id: approve ? "" : cleanId,
      status: approve ? "Telemóvel Autorizado no POS " + targetPosName : "Telemóvel Revogado pelo Admin",
      ack: (approve ? "Autorizado no POS " + targetPosName : "Revogado") + " pelo Administrador Central"
    };

    // 1. Enviar para a caixa de entrada exclusiva daquele telemóvel (funciona mesmo sem QR Code prévio!)
    const devInbox = "pos_bd_dev_" + cleanId.replace(/[^A-Z0-9]/gi, "").toLowerCase();
    await fetch("https://ntfy.sh/" + encodeURIComponent(devInbox), {
      method: "POST",
      body: JSON.stringify(updatePacket)
    });

    // 2. Enviar ordem assinada para o POS escolhido
    await fetch("https://ntfy.sh/" + encodeURIComponent(targetCh), {
      method: "POST",
      body: JSON.stringify({ action, device_id: cleanId, device_name: devName || cleanId, ts, sig })
    });

    // 3. Publicar também no canal ACK do POS
    await fetch("https://ntfy.sh/" + encodeURIComponent(targetCh + "_ack"), {
      method: "POST",
      body: JSON.stringify(updatePacket)
    });

    if (st) {
      st.className = approve ? "status ok" : "status err";
      st.textContent = approve
        ? "✅ Telemóvel " + cleanId + " (" + (devName || "Gerente") + ") AUTORIZADO e associado ao POS '" + targetPosName + "'!"
        : "🚫 Telemóvel " + cleanId + " BLOQUEADO / REVOGADO com sucesso!";
    }
  } catch (e) {
    if (st) {
      st.className = "status err";
      st.textContent = "❌ Erro: " + e.message;
    }
  }
}

function injectDeviceControlPanel() {
  const ackPanel = document.querySelector(".ack-panel");
  if (!ackPanel || document.getElementById("devCtrlBox")) return;
  const box = document.createElement("div");
  box.id = "devCtrlBox";
  box.className = "section-box";
  box.innerHTML = `
    <div class="section-title">📱 Controlo Central de Telemóveis & Associação Multi-POS</div>
    <div class="section-hint">Todos os seus POS registam-se automaticamente na lista abaixo. Quando um gerente pede acesso de qualquer telemóvel, escolha a qual POS o quer associar (ou autorize o mesmo ID para vários POS):</div>
    <label style="margin-top:4px;">🏪 1. Escolher Terminal POS da Frota</label>
    <select id="manualPosSelect">${getPosOptionsHtml()}</select>
    <div class="grid2" style="margin-top:6px;">
      <div>
        <label style="margin-top:2px;">ID do Telemóvel (MGR-...)</label>
        <input type="text" id="manualDevId" placeholder="Ex: MGR-8F4A-29C1" style="text-transform:uppercase;font-family:monospace;font-weight:800;">
      </div>
      <div>
        <label style="margin-top:2px;">Nome / Gerente</label>
        <input type="text" id="manualDevName" placeholder="Ex: João Gerente">
      </div>
    </div>
    <div class="grid2" style="margin-top:8px;">
      <button class="btn" style="margin-top:0;padding:10px;font-size:12px;background:#a3be8c;color:#171a21;" onclick="const s=document.getElementById('manualPosSelect'); adminDecideDevice(s.value, s.options[s.selectedIndex].getAttribute('data-posname'), document.getElementById('manualDevId').value, document.getElementById('manualDevName').value, true)">✅ AUTORIZAR NESTE POS</button>
      <button class="btn" style="margin-top:0;padding:10px;font-size:12px;background:#bf616a;color:#ffffff;" onclick="const s=document.getElementById('manualPosSelect'); adminDecideDevice(s.value, s.options[s.selectedIndex].getAttribute('data-posname'), document.getElementById('manualDevId').value, document.getElementById('manualDevName').value, false)">🚫 REVOGAR / BLOQUEAR</button>
    </div>
  `;
  ackPanel.parentNode.insertBefore(box, ackPanel);
}

async function downloadBackupFile(url, fname) {
  try {
    const r = await fetch(url);
    if (!r.ok) throw new Error("HTTP " + r.status);
    const blob = await r.blob();
    const objUrl = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = objUrl;
    a.download = fname || "POS_Cofre_Emergencia.tar.gz";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(objUrl), 15000);
  } catch (e) {
    window.open(url, "_blank");
  }
}

function addAckLog(msg) {
  if (msg && msg.pos_channel && msg.hostname) {
    registerFleetPos(msg.pos_channel, msg.hostname);
  }
  injectDeviceControlPanel();
  ackLogs.unshift(msg);
  ackLogs = ackLogs.slice(0, 30);
  const box = document.getElementById("ackList");
  const cnt = document.getElementById("ackCount");
  if (!box || !cnt) return;
  cnt.textContent = ackLogs.length + " resposta(s)";
  box.innerHTML = ackLogs.map((m, idx) => {
    if (m.error) {
      return `<div class="ack-item err-item"><b>❌ ${m.hostname || 'POS'} (${m.ip || ''})</b> — ${m.error} <span style="float:right;color:#81a1c1;">${m.ts || ''}</span></div>`;
    }
    const items = Array.isArray(m.applied) ? m.applied.join(", ") : (m.status || "OK");
    const escRep = m.report ? `<div class="diag-pre">${String(m.report).replace(/</g, '&lt;').replace(/>/g, '&gt;')}</div>` : "";
    const dlBtn = m.download_url
      ? `<button onclick="downloadBackupFile('${m.download_url}', '${m.download_name || 'POS_Cofre_Emergencia.tar.gz'}')" style="margin-top:8px; width:100%; background:#a3be8c; color:#171a21; border:none; border-radius:8px; padding:10px; font-weight:800; font-size:12.5px; cursor:pointer;">📥 DESCARREGAR BACKUP PARA O TELEMÓVEL (${m.download_name || 'Backup.tar.gz'}${m.download_size_mb ? ' • ' + m.download_size_mb + ' MB' : ''})</button>`
      : "";
    let devBtns = "";
    if (m.device_request && m.device_request.device_id) {
      const dr = m.device_request;
      const safeName = String(dr.device_name || "Gerente").replace(/'/g, "");
      const safeCh = String(dr.channel || "").replace(/'/g, "");
      const safeId = String(dr.device_id).replace(/'/g, "");
      const selId = "reqPosSel_" + idx;
      devBtns = `
        <div style="background:#171a21;padding:8px;border-radius:8px;margin-top:8px;border:1px solid #5e81ac66;">
          <div style="font-size:11px;color:#ebcb8b;font-weight:700;margin-bottom:4px;">🏪 Associar telemóvel <b>${safeId}</b> a qual Terminal POS?</div>
          <select id="${selId}" style="margin-bottom:6px;padding:7px;font-size:12.5px;font-weight:700;">${getPosOptionsHtml(safeCh)}</select>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
            <button onclick="const s=document.getElementById('${selId}'); adminDecideDevice(s.value, s.options[s.selectedIndex].getAttribute('data-posname'), '${safeId}', '${safeName}', true)" style="background:#a3be8c;color:#171a21;border:none;border-radius:7px;padding:9px;font-weight:800;font-size:11.5px;cursor:pointer;">✅ AUTORIZAR NESTE POS</button>
            <button onclick="const s=document.getElementById('${selId}'); adminDecideDevice(s.value, s.options[s.selectedIndex].getAttribute('data-posname'), '${safeId}', '${safeName}', false)" style="background:#bf616a;color:#ffffff;border:none;border-radius:7px;padding:9px;font-weight:800;font-size:11.5px;cursor:pointer;">🚫 BLOQUEAR (${safeId})</button>
          </div>
        </div>
      `;
    }
    return `<div class="ack-item"><b>✔ ${m.hostname || 'POS'} (${m.ip || ''})</b><span style="float:right;color:#81a1c1;">${m.ts || ''}</span><br><span style="color:#a3be8c;font-weight:700;">${m.status || 'Atualizado'}:</span> ${items}${escRep}${dlBtn}${devBtns}</div>`;
  }).join("");
}

function startFleetAckListener() {
  if (!FLEET_CHANNEL) return;
  fetch("https://ntfy.sh/" + FLEET_CHANNEL + "_ack/json?poll=1&since=24h")
    .then(r => r.text())
    .then(txt => {
      txt.trim().split("\n").forEach(line => {
        if (!line.trim()) return;
        try {
          const ev = JSON.parse(line);
          if (ev.event === "message" && ev.message) addAckLog(JSON.parse(ev.message));
        } catch (e) {}
      });
    }).catch(() => {});

  if (window.EventSource) {
    const es = new EventSource("https://ntfy.sh/" + FLEET_CHANNEL + "_ack/sse");
    es.onmessage = (ev) => {
      try {
        const d = JSON.parse(ev.data);
        if (d.message) addAckLog(JSON.parse(d.message));
      } catch (e) {}
    };
  }
}

async function sendRemoteDiag(diag_cmd) {
  const st = document.getElementById("status");
  const authPin = document.getElementById("curTechPin").value.trim();
  const target_host = document.getElementById("targetHost").value.trim() || "ALL";
  if (!authPin) {
    st.className = "status err";
    st.textContent = "❌ Introduza a Chave de Assinatura.";
    return;
  }
  st.className = "status ok";
  st.textContent = "⏳ A enviar comando de diagnóstico/reparação 2FA para o POS...";
  try {
    const nowSec = Math.floor(Date.now() / 1000);
    const policy_id = String(Date.now());
    const ts = String(nowSec);
    const totp = await computeTotpCode(TOTP_SECRET_B32, Math.floor(nowSec / 30));
    const payloadObj = { action: "remote_diag", diag_cmd, target_host, totp };
    const plainBytes = new TextEncoder().encode(JSON.stringify(payloadObj));
    const cipherBytes = await xorCrypt(plainBytes, authPin);
    const cipher_b64 = uint8ToBase64(cipherBytes);
    const sig = await sha256Hex(`${policy_id}|${ts}|${cipher_b64}|${authPin}|${FLEET_MASTER_SALT}`);
    const envelope = JSON.stringify({ policy_id, ts, cipher_b64, sig });
    const r = await fetch("https://ntfy.sh/" + FLEET_CHANNEL, { method: "POST", body: envelope });
    if (r.ok) {
      st.className = "status ok";
      st.textContent = "✅ Comando 2FA enviado! O relatório do POS vai aparecer abaixo em poucos segundos.";
    }
  } catch (e) {
    st.className = "status err";
    st.textContent = "❌ Erro: " + e.message;
  }
}

async function broadcastPolicy(isPing = false) {
  const st = document.getElementById("status");
  const authPin = document.getElementById("curTechPin").value.trim();
  const target_host = document.getElementById("targetHost").value.trim() || "ALL";
  const new_tech_pin = document.getElementById("newTechPin").value.trim();
  const manager_pin = document.getElementById("newMgrPin").value.trim();
  const linux_pos_password = document.getElementById("newPosPw").value.trim();
  const linux_root_password = document.getElementById("newRootPw").value.trim();
  const rustdesk_password = document.getElementById("newRustPw").value.trim();

  if (!authPin) {
    st.className = "status err";
    st.textContent = "❌ Introduza a Chave de Assinatura.";
    return;
  }

  if (!isPing && !new_tech_pin && !manager_pin && !linux_pos_password && !linux_root_password && !rustdesk_password) {
    st.className = "status err";
    st.textContent = "❌ Preencha pelo menos um novo PIN ou Password para atualizar.";
    return;
  }

  st.className = "status ok";
  st.textContent = isPing
    ? "⏳ A gerar Token 2FA e interrogar todos os terminais POS..."
    : "⏳ A assinar com Token 2FA e publicar Política de Segurança...";

  try {
    const nowSec = Math.floor(Date.now() / 1000);
    const policy_id = String(Date.now());
    const ts = String(nowSec);
    const totp = await computeTotpCode(TOTP_SECRET_B32, Math.floor(nowSec / 30));

    const payloadObj = isPing
      ? { action: "ping_fleet", target_host, totp }
      : {
          action: "update_security",
          target_host,
          totp,
          new_tech_pin,
          manager_pin,
          linux_pos_password,
          linux_root_password,
          rustdesk_password
        };

    const plainBytes = new TextEncoder().encode(JSON.stringify(payloadObj));
    const cipherBytes = await xorCrypt(plainBytes, authPin);
    const cipher_b64 = uint8ToBase64(cipherBytes);
    const sig = await sha256Hex(`${policy_id}|${ts}|${cipher_b64}|${authPin}|${FLEET_MASTER_SALT}`);

    const envelope = JSON.stringify({ policy_id, ts, cipher_b64, sig });
    const r = await fetch("https://ntfy.sh/" + FLEET_CHANNEL, {
      method: "POST",
      body: envelope
    });

    if (r.ok) {
      st.className = "status ok";
      st.textContent = isPing
        ? "✅ Ping 2FA enviado! Veja abaixo os terminais POS que responderam."
        : "✅ Política 2FA encriptada publicada! Os terminais POS estão a confirmar abaixo.";
    } else {
      st.className = "status err";
      st.textContent = "❌ Erro ao comunicar (" + r.status + ")";
    }
  } catch (e) {
    st.className = "status err";
    st.textContent = "❌ Erro: " + e.message;
  }
}
