<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#171a21">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>Cofre Restrito — Between Dimensions</title>
<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { margin: 0; padding: 12px; background: #171a21; color: #eceff4; }
  .card { max-width: 540px; margin: 20px auto; background: #242933; border-radius: 16px; padding: 22px; box-shadow: 0 12px 32px rgba(0,0,0,0.55); border: 1px solid #3b4252; }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
  h1 { font-size: 17px; margin: 0; color: #88c0d0; }
  .bd-header-logo { height: 22px; width: auto; opacity: 0.9; }
  .sub { font-size: 12px; color: #a3be8c; margin-bottom: 14px; font-weight: 600; }
  .safe-note { background: #1b2028; border: 1px solid #a3be8c55; border-radius: 10px; padding: 10px 12px; font-size: 11.5px; color: #d8dee9; line-height: 1.45; margin-bottom: 12px; }
  .safe-note b { color: #a3be8c; }
  label { display: block; font-size: 11.5px; font-weight: 700; color: #88c0d0; margin-bottom: 5px; margin-top: 10px; text-transform: uppercase; letter-spacing: 0.4px; }
  input, select { width: 100%; background: #171a21; border: 1px solid #434c5e; color: #ffffff; border-radius: 9px; padding: 11px 12px; font-size: 15px; outline: none; }
  input:focus { border-color: #88c0d0; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (max-width: 460px) { .grid2 { grid-template-columns: 1fr; gap: 2px; } }
  .section-box { background: #1d212a; border: 1px solid #3b4252; border-radius: 12px; padding: 12px; margin-top: 12px; }
  .section-title { font-size: 12px; font-weight: 800; color: #ebcb8b; margin-bottom: 4px; }
  .section-hint { font-size: 11px; color: #81a1c1; margin-bottom: 8px; }
  .btn { width: 100%; border: none; border-radius: 10px; padding: 13px; font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 12px; transition: opacity 0.15s; }
  .btn:active { opacity: 0.85; }
  .btn-push { background: #a3be8c; color: #171a21; }
  .btn-ping { background: #5e81ac; color: #ffffff; margin-top: 8px; padding: 10px; font-size: 12.5px; }
  .btn-back { background: #3b4252; color: #eceff4; margin-top: 12px; padding: 10px; font-size: 12px; }
  .status { margin-top: 12px; padding: 10px; border-radius: 9px; font-size: 13px; font-weight: 700; display: none; text-align: center; }
  .ok { background: #1e4620; color: #a3be8c; border: 1px solid #a3be8c; display: block; }
  .err { background: #4a1c1c; color: #ff8b8b; border: 1px solid #bf616a; display: block; }
  .ack-panel { margin-top: 14px; background: #171a21; border: 1px solid #3b4252; border-radius: 11px; padding: 11px; }
  .ack-hdr { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 800; color: #88c0d0; margin-bottom: 8px; }
  .ack-list { max-height: 220px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .ack-item { background: #242933; border-left: 4px solid #a3be8c; padding: 8px 10px; border-radius: 6px; font-size: 12px; }
  .ack-item.err-item { border-left-color: #bf616a; }
  .footer { display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 11px; color: #7b88a1; margin-top: 16px; padding-top: 10px; border-top: 1px solid #323846; }

<div class="card" id="appRoot">
  <div style="text-align:center;padding:12px 4px;">
    <img src="./bd-logo.png" alt="Between Dimensions" style="height:32px;margin-bottom:14px;opacity:0.9;">
    <h1 style="justify-content:center;color:#ebcb8b;font-size:18px;margin-bottom:6px;">🔒 Cofre de Administração Técnica</h1>
    <div style="font-size:12.5px;color:#81a1c1;margin-bottom:18px;line-height:1.45;">
      Esta página está encriptada com <b>PBKDF2-HMAC-SHA256 (150.000 iterações)</b>.<br>
      Sem a Chave Mestra Técnica, o painel, os canais e os terminais POS não existem no código-fonte.
    </div>
    <label style="text-align:left;">🔑 Chave Mestra Técnica</label>
    <input type="password" id="vaultKey" placeholder="Introduza a Chave Mestra..." onkeydown="if(event.key==='Enter')unlockVault()">
    <button class="btn btn-push" id="unlockBtn" onclick="unlockVault()">🔓 DESBLOQUEAR COFRE CENTRAL</button>
    <div id="vaultErr" class="status"></div>
  </div>
</div>

let FLEET_CHANNEL = "";
let FLEET_MASTER_SALT = "";
let ackLogs = [];

function b64ToUint8(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function uint8ToBase64(u8) {
  let bin = "";
  for (let i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]);
  return btoa(bin);
}

function bytesToHex(u8) {
  return Array.from(u8).map(b => b.toString(16).padStart(2, "0")).join("");
}

async function sha256Bytes(uint8Arr) {
  const buf = await crypto.subtle.digest("SHA-256", uint8Arr);
  return new Uint8Array(buf);
}

async function sha256Hex(str) {
  return bytesToHex(await sha256Bytes(new TextEncoder().encode(str)));
}

async function unlockVault() {
  const keyStr = document.getElementById("vaultKey").value.trim();
  const errEl = document.getElementById("vaultErr");
  const btn = document.getElementById("unlockBtn");
  if (!keyStr) {
    errEl.className = "status err";
    errEl.textContent = "❌ Introduza a Chave Mestra Técnica.";
    return;
  }
  btn.textContent = "⏳ A desencriptar cofre (PBKDF2 150.000x)...";
  try {
    const salt = b64ToUint8(VAULT_SALT_B64);
    const cipherBytes = b64ToUint8(VAULT_CIPHER_B64);
    const baseKey = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(keyStr), { name: "PBKDF2" }, false, ["deriveBits"]
    );
    const bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", salt, iterations: VAULT_ITER, hash: "SHA-256" },
      baseKey, 512
    );
    const dk = new Uint8Array(bits);
    const encKey = dk.slice(0, 32);
    const macKey = dk.slice(32, 64);

    const hmacCryptoKey = await crypto.subtle.importKey(
      "raw", macKey, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]
    );
    const sigBuf = await crypto.subtle.sign("HMAC", hmacCryptoKey, cipherBytes);
    const calcMac = bytesToHex(new Uint8Array(sigBuf));

    if (calcMac !== VAULT_MAC_HEX) {
      btn.textContent = "🔓 DESBLOQUEAR COFRE CENTRAL";
      errEl.className = "status err";
      errEl.textContent = "❌ Acesso Negado: Chave Mestra incorreta!";
      return;
    }

    const plainBytes = new Uint8Array(cipherBytes.length);
    let counter = 0;
    let offset = 0;
    while (offset < cipherBytes.length) {
      const ctrBuf = new Uint8Array(36);
      ctrBuf.set(encKey, 0);
      ctrBuf[32] = (counter >>> 24) & 0xff;
      ctrBuf[33] = (counter >>> 16) & 0xff;
      ctrBuf[34] = (counter >>> 8) & 0xff;
      ctrBuf[35] = counter & 0xff;
      const block = await sha256Bytes(ctrBuf);
      const chunk = Math.min(32, cipherBytes.length - offset);
      for (let i = 0; i < chunk; i++) {
        plainBytes[offset + i] = cipherBytes[offset + i] ^ block[i];
      }
      offset += chunk;
      counter++;
    }

    const data = JSON.parse(new TextDecoder().decode(plainBytes));
    FLEET_CHANNEL = data.fleet_channel;
    FLEET_MASTER_SALT = data.fleet_salt;
    document.getElementById("appRoot").innerHTML = data.html;
    document.getElementById("curTechPin").value = keyStr;
    startFleetAckListener();
  } catch (e) {
    btn.textContent = "🔓 DESBLOQUEAR COFRE CENTRAL";
    errEl.className = "status err";
    errEl.textContent = "❌ Erro ao desencriptar: " + e.message;
  }
}

async function xorCrypt(dataBytes, keyStr) {
  const out = new Uint8Array(dataBytes.length);
  const keyBytes = new TextEncoder().encode(keyStr + "|" + FLEET_MASTER_SALT);
  let counter = 0;
  let offset = 0;
  while (offset < dataBytes.length) {
    const ctrBuf = new Uint8Array(keyBytes.length + 4);
    ctrBuf.set(keyBytes, 0);
    ctrBuf[keyBytes.length] = (counter >>> 24) & 0xff;
    ctrBuf[keyBytes.length + 1] = (counter >>> 16) & 0xff;
    ctrBuf[keyBytes.length + 2] = (counter >>> 8) & 0xff;
    ctrBuf[keyBytes.length + 3] = counter & 0xff;
    const block = await sha256Bytes(ctrBuf);
    const chunkLen = Math.min(32, dataBytes.length - offset);
    for (let i = 0; i < chunkLen; i++) {
      out[offset + i] = dataBytes[offset + i] ^ block[i];
    }
    offset += chunkLen;
    counter++;
  }
  return out;
}

function addAckLog(msg) {
  ackLogs.unshift(msg);
  ackLogs = ackLogs.slice(0, 30);
  const box = document.getElementById("ackList");
  const cnt = document.getElementById("ackCount");
  if (!box || !cnt) return;
  cnt.textContent = ackLogs.length + " resposta(s)";
  box.innerHTML = ackLogs.map(m => {
    if (m.error) {
      return `<div class="ack-item err-item"><b>❌ ${m.hostname || 'POS'} (${m.ip || ''})</b> — ${m.error} <span style="float:right;color:#81a1c1;">${m.ts || ''}</span></div>`;
    }
    const items = Array.isArray(m.applied) ? m.applied.join(", ") : (m.status || "OK");
    return `<div class="ack-item"><b>✔ ${m.hostname || 'POS'} (${m.ip || ''})</b><span style="float:right;color:#81a1c1;">${m.ts || ''}</span><br><span style="color:#a3be8c;font-weight:700;">${m.status || 'Atualizado'}:</span> ${items}</div>`;
  }).join("");
}

function startFleetAckListener() {
  if (!FLEET_CHANNEL) return;
  fetch("https://ntfy.sh/" + FLEET_CHANNEL + "_ack/json?poll=1&since=24h")
    .then(r => r.text())
    .then(txt => {
      txt.trim().split("\n").forEach(line => {
        if (!line.trim()) return;
        try {
          const ev = JSON.parse(line);
          if (ev.event === "message" && ev.message) addAckLog(JSON.parse(ev.message));
        } catch (e) {}
      });
    }).catch(() => {});

  if (window.EventSource) {
    const es = new EventSource("https://ntfy.sh/" + FLEET_CHANNEL + "_ack/sse");
    es.onmessage = (ev) => {
      try {
        const d = JSON.parse(ev.data);
        if (d.message) addAckLog(JSON.parse(d.message));
      } catch (e) {}
    };
  }
}

async function broadcastPolicy(isPing = false) {
  const st = document.getElementById("status");
  const authPin = document.getElementById("curTechPin").value.trim();
  const target_host = document.getElementById("targetHost").value.trim() || "ALL";
  const new_tech_pin = document.getElementById("newTechPin").value.trim();
  const manager_pin = document.getElementById("newMgrPin").value.trim();
  const linux_pos_password = document.getElementById("newPosPw").value.trim();
  const linux_root_password = document.getElementById("newRootPw").value.trim();
  const rustdesk_password = document.getElementById("newRustPw").value.trim();

  if (!authPin) {
    st.className = "status err";
    st.textContent = "❌ Introduza o PIN Técnico Atual para assinar e encriptar a ordem.";
    return;
  }

  if (!isPing && !new_tech_pin && !manager_pin && !linux_pos_password && !linux_root_password && !rustdesk_password) {
    st.className = "status err";
    st.textContent = "❌ Preencha pelo menos um novo PIN ou Password para atualizar.";
    return;
  }

  st.className = "status ok";
  st.textContent = isPing
    ? "⏳ A interrogar todos os terminais POS da frota..."
    : "⏳ A encriptar e publicar nova Política de Segurança para a frota POS...";

  try {
    const policy_id = String(Date.now());
    const ts = String(Math.floor(Date.now() / 1000));
    const payloadObj = isPing
      ? { action: "ping_fleet", target_host }
      : {
          action: "update_security",
          target_host,
          new_tech_pin,
          manager_pin,
          linux_pos_password,
          linux_root_password,
          rustdesk_password
        };

    const plainBytes = new TextEncoder().encode(JSON.stringify(payloadObj));
    const cipherBytes = await xorCrypt(plainBytes, authPin);
    const cipher_b64 = uint8ToBase64(cipherBytes);
    const sig = await sha256Hex(`${policy_id}|${ts}|${cipher_b64}|${authPin}|${FLEET_MASTER_SALT}`);

    const envelope = JSON.stringify({ policy_id, ts, cipher_b64, sig });
    const r = await fetch("https://ntfy.sh/" + FLEET_CHANNEL, {
      method: "POST",
      body: envelope
    });

    if (r.ok) {
      if (!isPing && new_tech_pin) {
        document.getElementById("curTechPin").value = new_tech_pin;
        document.getElementById("newTechPin").value = "";
      }
      st.className = "status ok";
      st.textContent = isPing
        ? "✅ Ping enviado! Veja abaixo os terminais POS que responderam."
        : "✅ Política encriptada publicada! Os terminais POS estão a confirmar abaixo em tempo real.";
    } else {
      st.className = "status err";
      st.textContent = "❌ Erro ao comunicar (" + r.status + ")";
    }
  } catch (e) {
    st.className = "status err";
    st.textContent = "❌ Erro: " + e.message;
  }
}
</script>
