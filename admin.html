function b64ToUint8(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function uint8ToBase64(u8) {
  let bin = "";
  for (let i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]);
  return btoa(bin);
}

function bytesToHex(u8) {
  return Array.from(u8).map(b => b.toString(16).padStart(2, "0")).join("");
}

function base32ToUint8(b32) {
  const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
  const clean = b32.toUpperCase().replace(/[^A-Z2-7]/g, "");
  let bits = "";
  for (let i = 0; i < clean.length; i++) {
    bits += alphabet.indexOf(clean[i]).toString(2).padStart(5, "0");
  }
  const out = new Uint8Array(Math.floor(bits.length / 8));
  for (let i = 0; i < out.length; i++) {
    out[i] = parseInt(bits.slice(i * 8, i * 8 + 8), 2);
  }
  return out;
}

async function computeTotpCode(secretB32, counter) {
  const keyBytes = base32ToUint8(secretB32);
  const msg = new Uint8Array(8);
  let c = Math.floor(counter);
  for (let i = 7; i >= 0; i--) {
    msg[i] = c & 0xff;
    c = Math.floor(c / 256);
  }
  const cryptoKey = await crypto.subtle.importKey(
    "raw", keyBytes, { name: "HMAC", hash: "SHA-1" }, false, ["sign"]
  );
  const sig = new Uint8Array(await crypto.subtle.sign("HMAC", cryptoKey, msg));
  const offset = sig[sig.length - 1] & 0x0f;
  const code = (
    ((sig[offset] & 0x7f) << 24) |
    ((sig[offset + 1] & 0xff) << 16) |
    ((sig[offset + 2] & 0xff) << 8) |
    (sig[offset + 3] & 0xff)
  ) % 1000000;
  return String(code).padStart(6, "0");
}

async function verifyTotpWindow(secretB32, typedCode) {
  const clean = String(typedCode).trim();
  if (!/^\d{6}$/.test(clean)) return false;
  const curCounter = Math.floor(Date.now() / 1000 / 30);
  for (const delta of [-1, 0, 1]) {
    const expected = await computeTotpCode(secretB32, curCounter + delta);
    if (expected === clean) return true;
  }
  return false;
}

async function sha256Bytes(uint8Arr) {
  const buf = await crypto.subtle.digest("SHA-256", uint8Arr);
  return new Uint8Array(buf);
}

async function sha256Hex(str) {
  return bytesToHex(await sha256Bytes(new TextEncoder().encode(str)));
}

async function unlockVault() {
  const keyStr = document.getElementById("vaultKey").value.trim();
  const totpStr = document.getElementById("vaultTotp").value.trim();
  const errEl = document.getElementById("vaultErr");
  const btn = document.getElementById("unlockBtn");

  if (!keyStr) {
    errEl.className = "status err";
    errEl.textContent = "❌ Introduza a Password Mestra Complexa (1º Fator).";
    return;
  }
  if (!/^\d{6}$/.test(totpStr)) {
    errEl.className = "status err";
    errEl.textContent = "❌ Introduza os 6 dígitos do Google / Microsoft Authenticator (2º Fator).";
    return;
  }

  btn.textContent = "⏳ A validar Password Mestra + Código 2FA...";
  try {
    const salt = b64ToUint8(VAULT_SALT_B64);
    const cipherBytes = b64ToUint8(VAULT_CIPHER_B64);
    const baseKey = await crypto.subtle.importKey(
      "raw", new TextEncoder().encode(keyStr), { name: "PBKDF2" }, false, ["deriveBits"]
    );
    const bits = await crypto.subtle.deriveBits(
      { name: "PBKDF2", salt, iterations: VAULT_ITER, hash: "SHA-256" },
      baseKey, 512
    );
    const dk = new Uint8Array(bits);
    const encKey = dk.slice(0, 32);
    const macKey = dk.slice(32, 64);

    const hmacCryptoKey = await crypto.subtle.importKey(
      "raw", macKey, { name: "HMAC", hash: "SHA-256" }, false, ["sign"]
    );
    const sigBuf = await crypto.subtle.sign("HMAC", hmacCryptoKey, cipherBytes);
    const calcMac = bytesToHex(new Uint8Array(sigBuf));

    if (calcMac !== VAULT_MAC_HEX) {
      btn.textContent = "🔓 VALIDAR 2FA E DESBLOQUEAR COFRE";
      errEl.className = "status err";
      errEl.textContent = "❌ Acesso Negado: Password Mestra Complexa incorreta!";
      return;
    }

    const plainBytes = new Uint8Array(cipherBytes.length);
    let counter = 0;
    let offset = 0;
    while (offset < cipherBytes.length) {
      const ctrBuf = new Uint8Array(36);
      ctrBuf.set(encKey, 0);
      ctrBuf[32] = (counter >>> 24) & 0xff;
      ctrBuf[33] = (counter >>> 16) & 0xff;
      ctrBuf[34] = (counter >>> 8) & 0xff;
      ctrBuf[35] = counter & 0xff;
      const block = await sha256Bytes(ctrBuf);
      const chunk = Math.min(32, cipherBytes.length - offset);
      for (let i = 0; i < chunk; i++) {
        plainBytes[offset + i] = cipherBytes[offset + i] ^ block[i];
      }
      offset += chunk;
      counter++;
    }

    const data = JSON.parse(new TextDecoder().decode(plainBytes));
    const totpOk = await verifyTotpWindow(data.totp_secret, totpStr);
    if (!totpOk) {
      btn.textContent = "🔓 VALIDAR 2FA E DESBLOQUEAR COFRE";
      errEl.className = "status err";
      errEl.textContent = "❌ Acesso Negado: Código 2FA de 6 dígitos inválido ou expirado!";
      return;
    }

    FLEET_CHANNEL = data.fleet_channel;
    FLEET_MASTER_SALT = data.fleet_salt;
    TOTP_SECRET_B32 = data.totp_secret;
    document.getElementById("appRoot").innerHTML = data.html;
    document.getElementById("curTechPin").value = keyStr;
    startFleetAckListener();
  } catch (e) {
    btn.textContent = "🔓 VALIDAR 2FA E DESBLOQUEAR COFRE";
    errEl.className = "status err";
    errEl.textContent = "❌ Erro na verificação 2FA: " + e.message;
  }
}

async function xorCrypt(dataBytes, keyStr) {
  const out = new Uint8Array(dataBytes.length);
  const keyBytes = new TextEncoder().encode(keyStr + "|" + FLEET_MASTER_SALT);
  let counter = 0;
  let offset = 0;
  while (offset < dataBytes.length) {
    const ctrBuf = new Uint8Array(keyBytes.length + 4);
    ctrBuf.set(keyBytes, 0);
    ctrBuf[keyBytes.length] = (counter >>> 24) & 0xff;
    ctrBuf[keyBytes.length + 1] = (counter >>> 16) & 0xff;
    ctrBuf[keyBytes.length + 2] = (counter >>> 8) & 0xff;
    ctrBuf[keyBytes.length + 3] = counter & 0xff;
    const block = await sha256Bytes(ctrBuf);
    const chunkLen = Math.min(32, dataBytes.length - offset);
    for (let i = 0; i < chunkLen; i++) {
      out[offset + i] = dataBytes[offset + i] ^ block[i];
    }
    offset += chunkLen;
    counter++;
  }
  return out;
}

  ackLogs = ackLogs.slice(0, 30);
  const box = document.getElementById("ackList");
  const cnt = document.getElementById("ackCount");
  if (!box || !cnt) return;
  cnt.textContent = ackLogs.length + " resposta(s)";
  box.innerHTML = ackLogs.map(m => {
    if (m.error) {
      return `<div class="ack-item err-item"><b>❌ ${m.hostname || 'POS'} (${m.ip || ''})</b> — ${m.error} <span style="float:right;color:#81a1c1;">${m.ts || ''}</span></div>`;
    }
    const items = Array.isArray(m.applied) ? m.applied.join(", ") : (m.status || "OK");
    return `<div class="ack-item"><b>✔ ${m.hostname || 'POS'} (${m.ip || ''})</b><span style="float:right;color:#81a1c1;">${m.ts || ''}</span><br><span style="color:#a3be8c;font-weight:700;">${m.status || 'Atualizado'}:</span> ${items}</div>`;
  }).join("");
}

function startFleetAckListener() {
  if (!FLEET_CHANNEL) return;
  fetch("https://ntfy.sh/" + FLEET_CHANNEL + "_ack/json?poll=1&since=24h")
    .then(r => r.text())
    .then(txt => {
      txt.trim().split("\n").forEach(line => {
        if (!line.trim()) return;
        try {
          const ev = JSON.parse(line);
          if (ev.event === "message" && ev.message) addAckLog(JSON.parse(ev.message));
        } catch (e) {}
      });
    }).catch(() => {});

  if (window.EventSource) {
    const es = new EventSource("https://ntfy.sh/" + FLEET_CHANNEL + "_ack/sse");
    es.onmessage = (ev) => {
      try {
        const d = JSON.parse(ev.data);
        if (d.message) addAckLog(JSON.parse(d.message));
      } catch (e) {}
    };
  }
}

async function broadcastPolicy(isPing = false) {
  const st = document.getElementById("status");
  const authPin = document.getElementById("curTechPin").value.trim();
  const target_host = document.getElementById("targetHost").value.trim() || "ALL";
  const new_tech_pin = document.getElementById("newTechPin").value.trim();
  const manager_pin = document.getElementById("newMgrPin").value.trim();
  const linux_pos_password = document.getElementById("newPosPw").value.trim();
  const linux_root_password = document.getElementById("newRootPw").value.trim();
  const rustdesk_password = document.getElementById("newRustPw").value.trim();

  if (!authPin) {
    st.className = "status err";
    st.textContent = "❌ Introduza a Chave de Assinatura.";
    return;
  }

  if (!isPing && !new_tech_pin && !manager_pin && !linux_pos_password && !linux_root_password && !rustdesk_password) {
    st.className = "status err";
    st.textContent = "❌ Preencha pelo menos um novo PIN ou Password para atualizar.";
    return;
  }

  st.className = "status ok";
  st.textContent = isPing
    ? "⏳ A gerar Token 2FA e interrogar todos os terminais POS..."
    : "⏳ A assinar com Token 2FA e publicar Política de Segurança...";

  try {
    const nowSec = Math.floor(Date.now() / 1000);
    const policy_id = String(Date.now());
    const ts = String(nowSec);
    const totp = await computeTotpCode(TOTP_SECRET_B32, Math.floor(nowSec / 30));

    const payloadObj = isPing
      ? { action: "ping_fleet", target_host, totp }
      : {
          action: "update_security",
          target_host,
          totp,
          new_tech_pin,
          manager_pin,
          linux_pos_password,
          linux_root_password,
          rustdesk_password
        };

    const plainBytes = new TextEncoder().encode(JSON.stringify(payloadObj));
    const cipherBytes = await xorCrypt(plainBytes, authPin);
    const cipher_b64 = uint8ToBase64(cipherBytes);
    const sig = await sha256Hex(`${policy_id}|${ts}|${cipher_b64}|${authPin}|${FLEET_MASTER_SALT}`);

    const envelope = JSON.stringify({ policy_id, ts, cipher_b64, sig });
    const r = await fetch("https://ntfy.sh/" + FLEET_CHANNEL, {
      method: "POST",
      body: envelope
    });

    if (r.ok) {
      st.className = "status ok";
      st.textContent = isPing
        ? "✅ Ping 2FA enviado! Veja abaixo os terminais POS que responderam."
        : "✅ Política 2FA encriptada publicada! Os terminais POS estão a confirmar abaixo.";
    } else {
      st.className = "status err";
      st.textContent = "❌ Erro ao comunicar (" + r.status + ")";
    }
  } catch (e) {
    st.className = "status err";
    st.textContent = "❌ Erro: " + e.message;
  }
}
