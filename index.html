<style>
  * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

  .card { max-width: 520px; margin: 6px auto; background: #262b36; border-radius: 16px; padding: 18px; box-shadow: 0 10px 30px rgba(0,0,0,0.55); border: 1px solid #3b4252; }

  .sub { font-size: 12px; color: #88c0d0; }
  .badge { background: #1f242d; color: #a3be8c; padding: 3px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; border: 1px solid #a3be8c88; white-space: nowrap; }
  label { display: block; font-size: 12px; font-weight: 700; color: #d8dee9; margin-bottom: 5px; margin-top: 11px; text-transform: uppercase; letter-spacing: 0.4px; }

function getOrCreateDeviceId() {
  let did = localStorage.getItem('pos_mgr_device_id');
  if (!did) {
    const rnd = Array.from(crypto.getRandomValues(new Uint8Array(4))).map(b => b.toString(16).padStart(2, '0')).join('').toUpperCase();
    did = 'MGR-' + rnd.slice(0, 4) + '-' + rnd.slice(4, 8);
    localStorage.setItem('pos_mgr_device_id', did);
  }
  return did;
}

function b64ToUint8(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

function bytesToHex(u8) {
  return Array.from(u8).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function sha256Bytes(uint8Arr) {
  const buf = await crypto.subtle.digest('SHA-256', uint8Arr);
  return new Uint8Array(buf);
}

async function sha256Hex(str) {
  return bytesToHex(await sha256Bytes(new TextEncoder().encode(str)));
}

async function initGatePairing() {
  deviceId = getOrCreateDeviceId();
  const lblDid = document.getElementById('lblDeviceId');
  if (lblDid) lblDid.textContent = deviceId;

  const savedDevName = localStorage.getItem('pos_mgr_device_name') || '';
  if (savedDevName && document.getElementById('reqDeviceName')) {
    document.getElementById('reqDeviceName').value = savedDevName;
  }

  if (hash) {
    const parts = hash.split('|');
    if (parts[0]) {
      channel = parts[0];
      posName = parts[1] || 'Restaurante-master';
      localStorage.setItem('pos_channel', channel);
      localStorage.setItem('pos_name', posName);
      if (window.history && window.history.replaceState) {
        window.history.replaceState(null, '', window.location.pathname);
      }
    }
  } else {
    channel = localStorage.getItem('pos_channel') || DEFAULT_CHANNEL;
    posName = localStorage.getItem('pos_name') || 'Restaurante-master';
  }

  const pairedEl = document.getElementById('pairedPosName');
  if (pairedEl) pairedEl.textContent = posName + ' (' + channel.slice(0, 12) + ')';

  // Escutar em tempo real aprovações ou revogações do Administrador
  startAckStream();
  await checkDeviceAuthorizationStatus();

  const savedVaultKey = localStorage.getItem('pos_app_vault_key_' + channel) || '';
  const savedDevToken = localStorage.getItem('pos_dev_token_' + channel) || '';
  const isRevoked = localStorage.getItem('pos_dev_revoked_' + channel) === '1';

  if (isRevoked) {
    const errEl = document.getElementById('gateErr');
    if (errEl) {
      errEl.className = 'status err';
      errEl.textContent = '🚫 Este telemóvel foi desautorizado pelo Administrador Central.';
    }
    return;
  }

  // Se este telemóvel já foi autorizado pelo Administrador, abre DIRETO sem pedir PIN nem password!
  if (channel && savedVaultKey && savedDevToken) {
    deviceToken = savedDevToken;
    await unlockAuthorizedApp(savedVaultKey);
  }
}

async function checkDeviceAuthorizationStatus() {
  if (!channel) return;
  try {
    const r = await fetch('https://ntfy.sh/' + encodeURIComponent(channel + '_ack') + '/json?poll=1&since=48h');
    if (!r.ok) return;
    const text = await r.text();
    for (const line of text.trim().split('\n')) {
      if (!line.trim()) continue;
      try {
        const ev = JSON.parse(line);
        if (ev.event === 'message' && ev.message) {
          const msg = JSON.parse(ev.message);
          handleAuthUpdatePacket(msg);
        }
      } catch (e) {}
    }
  } catch (e) {}
}

function handleAuthUpdatePacket(msg) {
  if (!msg) return;
  if (Array.isArray(msg.revoked_devices) && msg.revoked_devices.includes(deviceId)) {
    revokeLocalDevice();
    return;
  }
  if (msg.revoked_device_id === deviceId) {
    revokeLocalDevice();
    return;
  }
  if (msg.device_auth_update && msg.device_auth_update.device_id === deviceId) {
    const upd = msg.device_auth_update;
    if (upd.approved && upd.device_token && upd.app_vault_key) {
      localStorage.removeItem('pos_dev_revoked_' + channel);
      localStorage.setItem('pos_dev_token_' + channel, upd.device_token);
      localStorage.setItem('pos_app_vault_key_' + channel, upd.app_vault_key);
      deviceToken = upd.device_token;
      unlockAuthorizedApp(upd.app_vault_key);
    } else if (upd.approved === false) {
      revokeLocalDevice();
    }
  }
}

function revokeLocalDevice() {
  localStorage.removeItem('pos_dev_token_' + channel);
  localStorage.removeItem('pos_app_vault_key_' + channel);
  localStorage.setItem('pos_dev_revoked_' + channel, '1');
  if (!document.getElementById('gateBox')) {
    window.location.reload();
  } else {
    const errEl = document.getElementById('gateErr');
    if (errEl) {
      errEl.className = 'status err';
      errEl.textContent = '🚫 Acesso revogado pelo Administrador Central!';
    }
  }
}

async function sendDeviceAuthRequest() {
  const errEl = document.getElementById('gateErr');
  const btn = document.getElementById('btnReqAuth');
  const devNameInput = document.getElementById('reqDeviceName');
  const devName = (devNameInput ? devNameInput.value.trim() : '') || 'Telemóvel Gerente';

  if (!devNameInput || !devNameInput.value.trim()) {
    errEl.className = 'status err';
    errEl.textContent = '❌ Escreva o seu nome (ex: João - Gerente) para o Administrador identificar o telemóvel.';
    return;
  }

  localStorage.setItem('pos_mgr_device_name', devName);
  btn.textContent = '⏳ A enviar pedido ao Administrador...';

  try {
    const ts = Math.floor(Date.now() / 1000).toString();
    // 1. Enviar para o POS
    await fetch('https://ntfy.sh/' + encodeURIComponent(channel), {
      method: 'POST',
      body: JSON.stringify({
        action: 'request_device_auth',
        device_id: deviceId,
        device_name: devName,
        ts
      })
    });

    // 2. Enviar diretamente para o Cofre 2FA do Administrador (funciona mesmo com o POS desligado!)
    const adminAlert = {
      hostname: posName,
      ip: 'Telemóvel ' + deviceId,
      status: '📱 PEDIDO DE AUTORIZAÇÃO DE TELEMÓVEL',
      applied: ['Gerente: ' + devName + ' (' + deviceId + ')'],
      device_request: {
        device_id: deviceId,
        device_name: devName,
        channel: channel,
        pos_name: posName,
        ts: new Date().toLocaleTimeString('pt-PT')
      },
      ts: new Date().toLocaleTimeString('pt-PT')
    };
    await fetch('https://ntfy.sh/' + FLEET_ACK_CHANNEL, {
      method: 'POST',
      body: JSON.stringify(adminAlert)
    });

    btn.textContent = '⏳ Pedido Enviado! A aguardar aprovação...';
    errEl.className = 'status ok';
    errEl.innerHTML = '✅ <b>Pedido enviado ao Administrador!</b><br>Mal o Administrador toque em <b>"Autorizar"</b> no Cofre Central, este ecrã abre automaticamente (e nunca mais pede códigos).';
  } catch (e) {
    btn.textContent = '📲 PEDIR AUTORIZAÇÃO AO ADMINISTRADOR';
    errEl.className = 'status err';
    errEl.textContent = '❌ Erro de ligação: ' + e.message;
  }
}

async function unlockAuthorizedApp(vaultKey) {
  try {
    const salt = b64ToUint8(APP_SALT_B64);
    const cipherBytes = b64ToUint8(APP_CIPHER_B64);
    const baseKey = await crypto.subtle.importKey(
      'raw', new TextEncoder().encode(vaultKey), { name: 'PBKDF2' }, false, ['deriveBits']
    );
    const bits = await crypto.subtle.deriveBits(
      { name: 'PBKDF2', salt, iterations: APP_ITER, hash: 'SHA-256' },
      baseKey, 512
    );
    const dk = new Uint8Array(bits);
    const encKey = dk.slice(0, 32);
    const macKey = dk.slice(32, 64);

    const hmacKey = await crypto.subtle.importKey(
      'raw', macKey, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
    );
    const calcMac = bytesToHex(new Uint8Array(await crypto.subtle.sign('HMAC', hmacKey, cipherBytes)));
    if (calcMac !== APP_MAC_HEX) return;

    const plainBytes = new Uint8Array(cipherBytes.length);
    let counter = 0;
    let offset = 0;
    while (offset < cipherBytes.length) {
      const ctrBuf = new Uint8Array(36);
      ctrBuf.set(encKey, 0);
      ctrBuf[32] = (counter >>> 24) & 0xff;
      ctrBuf[33] = (counter >>> 16) & 0xff;
      ctrBuf[34] = (counter >>> 8) & 0xff;
      ctrBuf[35] = counter & 0xff;
      const block = await sha256Bytes(ctrBuf);
      const chunk = Math.min(32, cipherBytes.length - offset);
      for (let i = 0; i < chunk; i++) {
        plainBytes[offset + i] = cipherBytes[offset + i] ^ block[i];
      }
      offset += chunk;
      counter++;
    }

    const data = JSON.parse(new TextDecoder().decode(plainBytes));
    document.getElementById('mainCard').innerHTML = data.html;
    document.getElementById('posTitle').textContent = 'Terminal: ' + posName + ' (4G/5G/Wi-Fi)';
    const ftr = document.getElementById('footerDevId');
    if (ftr) ftr.textContent = 'Between Dimensions • Telemóvel Autorizado (' + deviceId + ')';

    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    if (isStandalone && document.getElementById('installBtn')) {
      document.getElementById('installBtn').style.display = 'none';
    }

    loadLocalHistory();
    pollAckHistory(false);
  } catch (e) {}
}

function startVoiceDictation() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const st = document.getElementById('status');
  const vBtn = document.getElementById('voiceBtn');
  if (!SR) {
    if (st) {
      st.className = 'status err';
      st.textContent = 'ℹ️ Use o ícone de microfone do teclado do telemóvel para ditar.';
    }
    return;
  }
  const rec = new SR();
  rec.lang = 'pt-PT';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  if (vBtn) vBtn.textContent = '🔴 A ouvir... Fale agora';
  rec.onresult = (ev) => {
    const spoken = ev.results[0][0].transcript;
    const noteEl = document.getElementById('note');
    if (noteEl && spoken) {
      noteEl.value = (noteEl.value ? noteEl.value + ' ' : '') + spoken;
    }
  };
  rec.onend = () => {
    if (vBtn) vBtn.textContent = '🎙️ Ditar por Voz';
  };
  rec.onerror = () => {
    if (vBtn) vBtn.textContent = '🎙️ Ditar por Voz';
  };
  rec.start();
}

function loadLocalHistory() {
  if (!channel) return;
  try {
    const raw = localStorage.getItem('pos_hist_' + channel);
    if (raw) messageHistory = JSON.parse(raw);
  } catch (e) {}
  renderHistory();
}

function saveLocalHistory(list) {
  if (!channel || !Array.isArray(list)) return;
  messageHistory = list;
  try {
    localStorage.setItem('pos_hist_' + channel, JSON.stringify(messageHistory));
  } catch (e) {}
  renderHistory();
}

function renderHistory() {
  const box = document.getElementById('histList');
  if (!box) return;
  if (!messageHistory || messageHistory.length === 0) {
    box.innerHTML = '<div style="color:#81a1c1;font-size:12px;text-align:center;padding:12px;">Ainda não existem mensagens registadas neste POS.</div>';
    return;
  }
  box.innerHTML = messageHistory.map(item => {
    const prio = item.priority || 'attention';
    const isOk = item.confirmed || (item.ack_status && item.ack_status.toLowerCase().includes('confirmado'));
    const badgeCls = isOk ? 'ok' : 'wait';
    const icon = isOk ? '✔ ' : '⏳ ';
    const escText = (item.text || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const escAck = (item.ack_status || 'Aguarda confirmação...').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const escSent = (item.sent_at || '').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const escAuth = (item.author || 'Gerente').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    return `
      <div class="hist-item ${prio}">
        <div class="hist-meta">
          <span>📤 Enviada: ${escSent}</span>
          <span>${escAuth}</span>
        </div>
        <div class="hist-text">${escText}</div>
        <div class="hist-ack ${badgeCls}">👁️ ${icon}${escAck}</div>
      </div>
    `;
  }).join('');
}

function processAckPayload(msg) {
  handleAuthUpdatePacket(msg);
  const ackEl = document.getElementById('ackText');
  const st = document.getElementById('status');
  if (Array.isArray(msg.history)) {
    saveLocalHistory(msg.history);
  }
  if (!ackEl || !st) return;
  if (msg.error) {
    ackEl.style.color = '#ff8b8b';
    ackEl.textContent = '❌ ' + msg.error;
    st.className = 'status err';
    st.textContent = '❌ ' + msg.error;
  } else if (msg.ack) {
    ackEl.style.color = '#a3be8c';
    ackEl.textContent = '✔ ' + (msg.status ? msg.status + ' — ' : '') + msg.ack;
  }
}

async function pollAckHistory(requestFromPos = false) {
  if (!channel) return;
  if (requestFromPos && deviceToken) {
    sendAction('sync_history', true);
  }
  try {
    const r = await fetch('https://ntfy.sh/' + encodeURIComponent(channel + '_ack') + '/json?poll=1&since=48h');
    if (r.ok) {
      const text = await r.text();
      const lines = text.trim().split('\n');
      for (const line of lines) {
        if (!line.trim()) continue;
        try {
          const ev = JSON.parse(line);
          if (ev.event === 'message' && ev.message) {
            const msg = JSON.parse(ev.message);
            processAckPayload(msg);
          }
        } catch (e) {}
      }
    }
  } catch (e) {}
}

function startAckStream() {
  if (!channel || !window.EventSource) return;
  try {
    const es = new EventSource('https://ntfy.sh/' + encodeURIComponent(channel + '_ack') + '/sse');
    es.onmessage = (ev) => {
      try {
        const d = JSON.parse(ev.data);
        if (d.message) {
          const msg = JSON.parse(d.message);
          processAckPayload(msg);
          if (msg.ack && !msg.error) {
            const st = document.getElementById('status');
            if (st) {
              st.className = 'status ok';
              st.textContent = '✅ ' + msg.ack;
            }
          }
        }
      } catch (e) {}
    };
  } catch (e) {}
}

initGatePairing();

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  const btn = document.getElementById('installBtn');
  if (btn) btn.style.display = 'flex';
});

window.addEventListener('appinstalled', () => {
  const btn = document.getElementById('installBtn');
  const g = document.getElementById('installGuide');
  if (btn) btn.style.display = 'none';
  if (g) g.style.display = 'none';
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

async function installPWA() {
  if (deferredPrompt) {
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    return;
  }
  const guide = document.getElementById('installGuide');
  if (!guide) return;
  const ua = navigator.userAgent || '';
  if (/iPhone|iPad|iPod/i.test(ua)) {
    guide.innerHTML = '🍏 <b>Para instalar no iPhone / iPad (Safari):</b><br>1. Toque no botão <b>Partilhar</b> (ícone quadrado com seta ⬆️ na barra do Safari).<br>2. Deslize e toque em <b>"Adicionar ao Ecrã Principal"</b>.';
  } else {
    guide.innerHTML = '📲 <b>Para instalar a App no Android:</b><br>1. Toque no menu <b>⋮ (3 pontos)</b> no canto superior direito do navegador.<br>2. Escolha <b>"Instalar aplicação"</b> ou <b>"Adicionar ao ecrã principal"</b>.';
  }
  guide.style.display = (guide.style.display === 'block') ? 'none' : 'block';
}

function toggleHistoryBox() {
  const box = document.getElementById('histBox');
  if (!box) return;
  const opening = box.style.display !== 'block';
  box.style.display = opening ? 'block' : 'none';
  if (opening) {
    renderHistory();
    pollAckHistory(true);
  }
}

function toggleTechClearBox() {
  const box = document.getElementById('techClearBox');
  if (box) box.style.display = (box.style.display === 'block') ? 'none' : 'block';
}

async function sendTechClearHistory() {
  const st = document.getElementById('status');
  const techPin = document.getElementById('techPinInput').value.trim();
  if (!channel) return;
  if (!techPin) {
    st.className = 'status err';
    st.textContent = '❌ Introduza o PIN Técnico para apagar o histórico.';
    return;
  }
  try {
    const ts = Math.floor(Date.now() / 1000).toString();
    const sigStr = channel + '|clear_history||' + ts + '|' + techPin;
    const sig = await sha256Hex(sigStr);
    const packet = { action: 'clear_history', text: '', ts, sig };
    const r = await fetch('https://ntfy.sh/' + encodeURIComponent(channel), {
      method: 'POST',
      body: JSON.stringify(packet)
    });
    if (r.ok) {
      document.getElementById('techPinInput').value = '';
      document.getElementById('techClearBox').style.display = 'none';
      st.className = 'status ok';
      st.textContent = '⏳ A validar PIN Técnico e limpar histórico no POS...';
    }
  } catch (e) {
    st.className = 'status err';
    st.textContent = '❌ Erro de ligação: ' + e.message;
  }
}

async function sendAction(action, silent = false) {
  const st = document.getElementById('status');
  const text = (action === 'clear' || action === 'sync_history') ? '' : document.getElementById('note').value.trim();
  const priority = document.getElementById('priority').value;
  const font_size = parseInt(document.getElementById('font_size').value, 10);
  const popup = document.getElementById('popup').checked;

  if (!channel || !deviceToken) return;
  if (action === 'publish' && !text) {
    st.className = 'status err';
    st.textContent = '❌ Escreva ou dite uma mensagem para os funcionários.';
    return;
  }

  if (!silent) {
    st.className = 'status ok';
    st.textContent = '⏳ A transmitir para o ecrã do POS...';
  }

  try {
    const ts = Math.floor(Date.now() / 1000).toString();
    const sigStr = channel + '|' + action + '|' + text + '|' + ts + '|' + deviceToken;
    const sig = await sha256Hex(sigStr);
    const devName = localStorage.getItem('pos_mgr_device_name') || 'Gerente Mobile';

    const packet = {
      action,
      text,
      priority,
      font_size,
      popup,
      device_id: deviceId,
      device_name: devName,
      ts,
      sig
    };

    const r = await fetch('https://ntfy.sh/' + encodeURIComponent(channel), {
      method: 'POST',
      body: JSON.stringify(packet)
    });

    if (r.ok && !silent) {
      st.className = 'status ok';
      st.textContent = action === 'clear'
        ? '✅ Ordem de limpeza enviada ao POS!'
        : '✅ Aviso transmitido! A aguardar confirmação do POS...';
      if (action === 'clear') document.getElementById('note').value = '';
    } else if (!r.ok && !silent) {
      st.className = 'status err';
      st.textContent = '❌ Erro na ligação (' + r.status + ')';
    }
  } catch (e) {
    if (!silent) {
      st.className = 'status err';
      st.textContent = '❌ Sem ligação à Internet: ' + e.message;
    }
  }
}
